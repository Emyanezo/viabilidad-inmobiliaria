<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama interactivo · Manual del Flujo Integral · Grupo Antani</title>
<style>
:root{
  --ink:#12263F;
  --ink-soft:#33495f;
  --muted:#6a7b8c;
  --line:#d5dde4;
  --bg:#ffffff;
  --bg-soft:#f7f9fb;
  --marketing:#C8842A;
  --comercial:#12263F;
  --cobranza:#2E8B7A;
  --crm:#4A8DB7;
  --legal:#7B68A6;
  --corp:#4C8B4A;
  --exit:#C0524A;
  --radius:10px;
  --font:'Poppins','Century Gothic','Futura','Avenir Next',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
}
.wrap{max-width:1760px;margin:0 auto;padding:34px 40px 70px}

/* ---------- header ---------- */
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--marketing);font-weight:600;margin:0 0 8px}
h1.title{font-size:29px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.subtitle{color:var(--muted);font-size:14px;margin:9px 0 0;max-width:720px}
.head{display:flex;gap:40px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:30px}
.legend{display:grid;grid-template-columns:repeat(2,auto);grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:5px 34px;font-size:12.5px;color:var(--ink-soft);padding-top:4px}
.legend span{display:flex;align-items:center;gap:9px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.hint{margin-top:14px;display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.hint b{color:var(--ink);font-weight:600}

/* ---------- map grid ---------- */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;align-items:start}
.col{min-width:0}
.phase{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marketing);font-weight:600;margin-bottom:3px}
.phase-name{font-size:19px;font-weight:600;margin:0 0 20px;letter-spacing:-.01em}
.col-foot{margin-top:16px;font-size:11.5px;color:var(--marketing);border-top:1px dashed #e6c79b;padding-top:9px;display:flex;align-items:center;gap:6px}

/* ---------- flow renderer ---------- */
.flow{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,.82fr);align-items:center}
.row.nobranch{grid-template-columns:minmax(0,1fr)}
.vconn{height:26px;display:flex;flex-direction:column;align-items:center;position:relative;grid-column:1}
.vconn .ln{width:1.5px;background:#b9c4ce;flex:1}
.vconn .tip{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid #b9c4ce;margin-top:-1px}
.vconn .lbl{position:absolute;left:calc(50% + 9px);top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;background:#fff;padding:0 3px}
.hconn{display:flex;align-items:center;position:relative;height:100%;min-height:26px}
.hconn .ln{height:1.5px;background:#b9c4ce;flex:1}
.hconn .tip{width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-left:6px solid #b9c4ce}
.hconn .lbl{position:absolute;left:50%;top:calc(50% - 15px);transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;background:#fff;padding:0 3px;z-index:3}
.node .eb-lbl{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
.hconn.red .ln{background:#e0a8a2}.hconn.red .tip{border-left-color:#e0a8a2}
.hconn.green .ln{background:#8fc4b6}.hconn.green .tip{border-left-color:#8fc4b6}

/* ---------- nodes ---------- */
.node{
  --c:var(--ink);
  position:relative;
  border:1.4px solid color-mix(in srgb, var(--c) 55%, #fff);
  background:color-mix(in srgb, var(--c) 6%, #fff);
  border-radius:var(--radius);
  padding:13px 15px;
  display:flex;gap:9px;align-items:flex-start;
  transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
}
.node .num{font-weight:600;font-size:13px;color:var(--c);flex:none;min-width:13px;line-height:1.35}
.node .txt{font-size:13.2px;line-height:1.35;min-width:0}
.node .txt .d{display:block;font-size:11.6px;color:var(--muted);margin-top:4px;line-height:1.4}
.node.small{padding:10px 13px}
.node.small .txt{font-size:12.2px}
.node.exit{--c:var(--exit);border-style:solid;text-align:left}
.node.exit .txt{color:#9c4740;font-size:12.2px}
.node.msg{--c:#7f8c99;background:#f3f6f9;border:1px solid #dce4eb;border-left:3px solid #9fb3c4;border-radius:4px 12px 12px 12px}
.node.msg .txt{font-size:12.6px;color:#2b3d4f;line-height:1.5}
.node.msg .txt .d{font-style:normal}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:7px}
.btn-pill{font-size:11.4px;border:1px solid #cbd6df;border-radius:99px;padding:5px 13px;color:var(--ink-soft);background:#fff;white-space:nowrap}
.group{margin:30px 0 14px;display:flex;align-items:center;gap:13px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marketing);font-weight:600}
.group::after{content:'';flex:1;height:1px;background:#ecd6b4}
.flow > .row:first-child .group{margin-top:0}
.node.note{--c:#8a97a3;background:#f7f9fb;border-style:dashed}
.node.note .txt{font-size:12px;color:var(--ink-soft)}
.node.term{background:var(--ink);border-color:var(--ink);justify-content:center}
.node.term .txt{color:#fff;font-weight:600;font-size:13.5px;text-align:center}
.node.clickable{cursor:pointer}
.node.clickable:hover,.node.clickable:focus-visible{
  transform:translateY(-1px);
  box-shadow:0 6px 18px -8px color-mix(in srgb, var(--c) 60%, transparent);
  border-color:var(--c);outline:none;
}
.node.clickable .plus{
  position:absolute;top:-8px;right:-8px;width:21px;height:21px;border-radius:50%;
  background:#fff;border:1.4px solid var(--c);color:var(--c);
  font-size:13px;line-height:18px;text-align:center;font-weight:600;
  box-shadow:0 1px 4px rgba(18,38,63,.12);
}
.node.clickable:hover .plus{background:var(--c);color:#fff}
.node.pending{border-style:dashed;opacity:.85}
.node .tag{
  display:inline-block;margin-top:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;
}

/* decision */
.dec{position:relative;display:flex;justify-content:center;align-items:center;min-height:96px;margin:2px 0}
.dec svg{position:absolute;inset:0;width:100%;height:100%}
.dec .dtxt{
  position:relative;width:62%;margin:0 auto;
  text-align:center;font-size:11.8px;font-weight:600;line-height:1.3;color:var(--ink);
}

/* ---------- footnotes ---------- */
.notes{margin-top:44px;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:9px;font-size:12.5px;color:var(--muted)}
.notes b{color:var(--ink);font-weight:600}
.notes .n-red b{color:var(--exit)}
.stamp{margin-top:22px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9aa7b4}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(18,38,63,.35);backdrop-filter:blur(3px);z-index:50;display:none;opacity:0;transition:opacity .18s ease}
.ov.on{display:block;opacity:1}
.panel{
  position:fixed;inset:22px;background:#fff;border-radius:16px;z-index:51;
  display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(18,38,63,.5);
  transform:translateY(10px);opacity:0;transition:opacity .18s ease, transform .18s ease;
}
.panel.on{display:flex;opacity:1;transform:none}
.pbar{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);flex:none}
.pbar .back{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:12.5px;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;
}
.pbar .back:hover{background:var(--bg-soft)}
.pbar .who{min-width:0;flex:1}
.pbar .eb{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pbar h2{margin:2px 0 0;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 9px;font-size:10.5px;letter-spacing:.06em;
  border:1px solid color-mix(in srgb,var(--c,#12263F) 40%,#fff);color:var(--c,#12263F);background:color-mix(in srgb,var(--c,#12263F) 7%,#fff);text-transform:uppercase}
.nav{display:flex;gap:8px;flex:none}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink);font-family:var(--font)}
.nav button:hover:not(:disabled){background:var(--bg-soft)}
.nav button:disabled{opacity:.32;cursor:default}
.nav .close{background:var(--ink);border-color:var(--ink);color:#fff}
.pbody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.85fr);gap:0}
.pflow{padding:30px 34px 60px;min-width:0;border-right:1px solid var(--line);background:
  radial-gradient(circle at 1px 1px, #e8edf2 1px, transparent 0) 0 0/22px 22px}
.pflow .flow{max-width:640px;margin:0 auto}
.pflow .row{grid-template-columns:minmax(0,1fr) 34px minmax(0,.72fr)}
.sec-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px;text-align:center}
.ficha{padding:28px 30px 60px;background:#fff;min-width:0}
.ficha h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.ficha h3:first-child{margin-top:0}
.ficha p.resumen{font-size:13.6px;line-height:1.55;color:var(--ink-soft);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.8px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);font-weight:500}
.ficha ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ficha li{font-size:12.8px;line-height:1.45;color:var(--ink-soft);padding-left:16px;position:relative}
.ficha li::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--c,#12263F);opacity:.55}
.ficha li b{color:var(--ink);font-weight:600}
.docs{display:flex;flex-wrap:wrap;gap:7px}
.doc{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink-soft);background:var(--bg-soft)}
.doc.miss{border-style:dashed;color:var(--exit);background:#fdf5f4;border-color:#eec8c3}
table.tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:2px}
table.tb th{text-align:left;font-weight:600;color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
table.tb td{padding:7px 8px 7px 0;border-bottom:1px solid #eef2f5;color:var(--ink-soft)}
table.tb td:first-child{font-weight:600;color:var(--ink)}
.warn{border-left:2.5px solid var(--exit);background:#fdf5f4;padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.4px;color:#8f4038;line-height:1.45}
.warn b{color:#7c352e}

@media (max-width:1400px){
  .map{grid-template-columns:repeat(2,1fr);gap:34px 26px}
}
@media (max-width:1100px){
  .pbody{grid-template-columns:1fr}
  .pflow{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:760px){
  .wrap{padding:22px 18px 50px}
  .map{grid-template-columns:1fr}
  .panel{inset:0;border-radius:0}
  .legend{grid-template-columns:1fr}
  .row{grid-template-columns:minmax(0,1fr) 22px minmax(0,.9fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <p class="eyebrow">Diagrama de flujo de la operación</p>
      <h1 class="title">Del anuncio al retorno: las 17 etapas del Manual del Flujo Integral</h1>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="map" id="map"></div>

  <div class="notes">
    <div class="stamp">Manual del Flujo Integral del Modelo de Negocio · Grupo Antani · USO INTERNO</div>
  </div>
</div>

<div class="ov" id="ov"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="pbar">
    <button class="back" id="back">&larr; Volver al mapa</button>
    <div class="who">
      <div class="eb" id="peb"></div>
      <h2 id="ptitle"></h2>
    </div>
    <div class="nav">
      <button id="prev" title="Etapa anterior (←)">&larr;</button>
      <button id="next" title="Etapa siguiente (→)">&rarr;</button>
      <button id="close" class="close" title="Cerrar (ESC)">&times;</button>
    </div>
  </div>
  <div class="pbody" id="pbody">
    <div class="pflow"><p class="sec-h">Proceso interno</p><div id="pflow"></div></div>
    <div class="ficha" id="pficha"></div>
  </div>
</div>

<script>
const AREAS = {
  marketing:'Marketing',
  comercial:'Área Comercial',
  cobranza:'Cobranza y Administración',
  crm:'CRM y automatización',
  legal:'Área Legal',
  corp:'Corporativo y Dirección'
};

/* ===================== MAPA GENERAL ===================== */
const PHASES = [
  {
    range:'Etapas 1 a 4', name:'Captación',
    foot:'Continúa en Fase 2 · Cierre y formalización →',
    nodes:[
      {n:'1', t:'Anuncio en redes sociales (Meta Ads)', area:'marketing'},
      {n:'2', t:'Formulario de perfilamiento', area:'crm', opens:2},
      {type:'dec', t:'¿Cumple la capacidad<br>económica mínima?',
        br:{label:'No', tone:'red', node:{type:'exit', t:'Se agradece el interés', d:'Sale del flujo de atención y entra a la Ruta A de nutrición.'}}},
      {n:'3', t:'ChatBot: atención, dudas y agenda', area:'crm', opens:3, in:'Sí'},
      {n:'4', t:'Videollamada con el asesor comercial', area:'comercial', opens:4}
    ]
  },
  {
    range:'Etapas 5 a 8', name:'Cierre y formalización',
    foot:'Continúa en Fase 3 · Cobranza →',
    nodes:[
      {n:'5', t:'Pipeline comercial en el CRM (Kommo)', area:'crm', opens:5},
      {type:'dec', t:'¿El prospecto<br>queda interesado?',
        br:{label:'No', tone:'red', node:{type:'exit', t:'Descartado: se conserva en base de datos'}}},
      {n:'6', t:'Alta del inversionista: KYC y esquema', area:'comercial', opens:6, in:'Sí'},
      {n:'7', t:'Integración del expediente documental', area:'legal', opens:7},
      {n:'8', t:'Firma de los 4 documentos (We Trust)', area:'legal', opens:8}
    ]
  },
  {
    range:'Etapas 9 a 13', name:'Cobranza',
    foot:'Continúa en Fase 4 · Incorporación y salida →',
    nodes:[
      {n:'9', t:'Inicio de las aportaciones mensuales', area:'cobranza'},
      {n:'10', t:'ChatBot de cobranza', area:'cobranza', opens:10},
      {n:'11', t:'Registro automático de pagos (BanBajío)', area:'cobranza', opens:11},
      {type:'dec', t:'¿Pago recibido<br>en tiempo?',
        br:{label:'No', node:{n:'12', t:'Gestión de morosidad', d:'Hasta 3 meses para regularizarse · si no, cancelación del contrato.', area:'cobranza', opens:12}}},

    ]
  },
  {
    range:'Etapas 14 a 17', name:'Incorporación y salida',
    nodes:[
      {n:'14', t:'Asamblea: incorporación como socio', area:'corp', opens:14},
      {n:'15', t:'Desarrollo del proyecto inmobiliario', area:'corp'},
      {n:'16', t:'Venta del proyecto (nueva asamblea)', area:'corp'},
      {n:'17', t:'Retorno de inversión y utilidades', area:'corp'},
      {type:'term', t:'Fin del ciclo del inversionista'}
    ]
  }
];

const TABLA_CLASES = {
  title:'Clases del vehículo SPV 18 · Anexo 03',
  head:['Clase','Precio/m²','Mensualidad','Total 24 m','Total 36 m'],
  rows:[
    ['1','$989','$200,000','$4,800,000','$7,200,000'],
    ['2','$1,079','$130,000','$3,120,000','$4,680,000'],
    ['3','$1,139','$85,000','$2,040,000','$3,060,000'],
    ['4','$1,209','$55,000','$1,320,000','$1,980,000'],
    ['5','$1,279','$35,000','$840,000','$1,260,000'],
    ['6','$1,349','$20,000','$480,000','$720,000']
  ]
};

/* ===================== ETAPAS CON PROCESO INTERNO ===================== */
const STAGES = [

/* ---------- 2 · FORMULARIO ---------- */
{
  id:2, title:'Perfilamiento del prospecto · Formulario de Meta', phase:'Fase 1 · Captación', section:'Manual, etapa 2 · Anexo 02, sección 2', area:'crm',
  resp:'Marketing (pauta) · CRM (formulario y etiquetado)',
  disparo:'Clic en el anuncio de Meta',
  salida:'Lead creado y etiquetado en Kommo, con nombre, teléfono y correo, redirigido al ChatBot',
  sistemas:'Meta Lead Ads → Kommo',
  sub:[
    {type:'group', t:'Entrada'},
    {t:'Clic en el anuncio', d:'Campaña de Meta (Facebook / Instagram). El formulario abre con nombre, teléfono y correo electrónico prellenados por Meta; se agregan 4 preguntas.', area:'marketing'},

    {type:'group', t:'P1 · Filtro 1 — capacidad (única pregunta que descarta)'},
    {type:'msg', t:'Para sumarte, la participación comienza a partir de $480 mil pesos. No necesitas tenerlo de contado: puedes hacerlo con aportaciones desde $20 mil al mes (a 24 o 36 meses). ¿Qué monto podrías destinar en total?'},
    {type:'btns', opts:['Menos de $480 mil','$480 mil – $1 millón','$1 – $5 millones','Más de $5 millones']},
    {type:'dec', t:'¿Capacidad ≥ $480 mil?',
      br:{label:'Menos de $480 mil', tone:'red', node:{type:'exit', t:'Descalifica automáticamente', d:'Sale del flujo de atención y entra a la Ruta A de nutrición.'}}},

    {type:'group', in:'Sí', t:'Sí califica · P2 – P4, etiquetas de contexto (no descartan)'},
    {type:'msg', eb:'P2', t:'¿En cuánto tiempo te gustaría sumarte al proyecto?'},
    {type:'btns', opts:['En los próximos 30 días','De 1 a 3 meses','De 3 a 6 meses','En más de 6 meses','Solo estoy explorando']},
    {type:'msg', eb:'P3', t:'¿Has comprado terrenos o bienes raíces antes?'},
    {type:'btns', opts:['Sí, bienes raíces / terrenos','Sí, otro tipo de proyectos','No, sería la primera vez']},
    {type:'msg', eb:'P4', t:'¿Qué es lo que más te interesa lograr hoy?'},
    {type:'btns', opts:['Construir patrimonio (3–6 años)','Ingreso o renta mensual','Solo estoy explorando']},

    {type:'group', t:'Salida del formulario'},
    {t:'Alta del lead en Kommo', d:'Se crea el lead con las etiquetas de contexto que dejan las cuatro preguntas. El objetivo y el plazo no cambian el mensaje del bot.', area:'crm'},

    {type:'msg', eb:'Pantalla final E2 · se muestra de inmediato en el formulario, no llega al bot', t:'¡Gracias por tu interés! En Grupo Antani preferimos ser transparentes: este proyecto en particular arranca con una entrada base de $480 mil pesos, y queremos que cualquier persona que se sume lo haga con la certeza de que es el momento correcto para hacerlo. Sin embargo, seguimos desarrollando nuevos proyectos, y nos encantaría avisarte cuando tengamos uno con un punto de entrada distinto.'},
    {t:'Etiqueta «nutrir-bajo-ticket»', d:'Entra a un goteo de baja frecuencia con avisos de nuevos proyectos. Nunca se descarta en frío ni se asigna al asesor.', area:'crm'}
  ],
  reglas:[
    'Regla de oro: el <b>único</b> filtro de descarte es la capacidad. Menos de $480 mil no continúa al flujo de atención.',
    'Plazo, experiencia previa y objetivo <b>nunca descartan</b>; son etiquetas de contexto y prioridad para el asesor.',

        ['2','<b>Seguridad jurídica.</b> Tres capas: el activo es real y está limpio (due diligence de escrituras, Registro Público, sin gravámenes ni litigios, uso de suelo y accesos) y queda escriturado a nombre de la persona moral; la participación se documenta con contrato desde el inicio y se registra en el libro de accionistas al completar el plan; y detrás está Grupo Antani como socio del proyecto, no como intermediario.'],

/* ============ renderer ============ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n;};
const cvar = a => `var(--${a||'comercial'})`;

function decision(text){
  const d=el('div','dec');
  d.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="50,1 99,50 50,99 1,50" fill="#fff" stroke="#12263F" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
  </svg><div class="dtxt">${text}</div>`;
  return d;
}
function fitDecisions(root){
  (root||document).querySelectorAll('.dec').forEach(d=>{
    const t=d.querySelector('.dtxt');
    if(!t) return;
    d.style.height = Math.max(96, Math.round(t.offsetHeight*2.75 + 12)) + 'px';
  });
}

function nodeEl(n, onOpen){
  if(n.type==='dec') return decision(n.t);
  if(n.type==='group') return el('div','group',n.t);
  if(n.type==='btns'){
    const b = el('div','btnrow');
    n.opts.forEach(o=>b.appendChild(el('span','btn-pill',o)));
    return b;
  }
  const cls = ['node', n.type==='exit'?'exit':'', n.type==='note'?'note':'', n.type==='term'?'term':'',
               n.type==='msg'?'msg':'',
               n.small?'small':'', n.opens?'clickable':'', n.pending?'pending':''].filter(Boolean).join(' ');
  const x = el('div', cls);
  x.style.setProperty('--c', cvar(n.area));
  let inner = '';
  if(n.n) inner += `<div class="num">${n.n}</div>`;
  inner += `<div class="txt">${n.eb?`<span class="eb-lbl">${n.eb}</span>`:''}${n.t}${n.d?`<span class="d">${n.d}</span>`:''}${n.tag?`<span class="tag">${n.tag}</span>`:''}</div>`;
  x.innerHTML = inner;
  if(n.opens){
    x.appendChild(el('div','plus','+'));
    x.tabIndex=0; x.setAttribute('role','button');
    x.addEventListener('click',()=>onOpen(n.opens));
    x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onOpen(n.opens);}});
  }
  return x;
}

function renderFlow(host, nodes, onOpen){
  host.innerHTML='';
  const f = el('div','flow');
  const noConn = t => t==='group'||t==='btns';
  nodes.forEach((n,i)=>{
    const prev = i>0 ? nodes[i-1] : null;
    const drawConn = i>0 && !noConn(prev.type) &&
      (!noConn(n.type) || (n.type==='group' && n.in));
    if(drawConn){
      const c = el('div','vconn');
      c.appendChild(el('div','ln'));
      c.appendChild(el('div','tip'));
      if(n.in) c.appendChild(el('div','lbl',n.in));
      const holder = el('div','row nobranch'); holder.appendChild(c);
      f.appendChild(holder);
    }
    const row = el('div', n.br? 'row':'row nobranch');
    row.appendChild(nodeEl(n,onOpen));
    if(n.br){
      const lab = n.br.label || '';
      const short = lab.length <= 4;
      const hc = el('div','hconn '+(n.br.tone||''));
      hc.appendChild(el('div','ln'));
      hc.appendChild(el('div','tip'));
      if(lab && short) hc.appendChild(el('div','lbl',lab));
      row.appendChild(hc);
      const bn = Object.assign({small:true}, n.br.node);
      if(lab && !short) bn.eb = lab;
      row.appendChild(nodeEl(bn, onOpen));
    }
    f.appendChild(row);
  });
  host.appendChild(f);
}

/* ============ map ============ */
function buildLegend(){
  const g = $('#legend');
  Object.entries(AREAS).forEach(([k,v])=>{
    const s = el('span','',`<i class="dot" style="background:${cvar(k)}"></i>${v}`);
    g.appendChild(s);
  });
}

function buildMap(){
  const m = $('#map'); m.innerHTML='';
  PHASES.forEach((p,i)=>{
    const c = el('div','col');
    c.appendChild(el('div','phase',`Fase ${i+1} · ${p.range}`));
    c.appendChild(el('h2','phase-name',p.name));
    const holder = el('div');
    renderFlow(holder, p.nodes, openStage);
    c.appendChild(holder);
    if(p.foot) c.appendChild(el('div','col-foot',p.foot));
    m.appendChild(c);
  });
  fitDecisions(m);
}

/* ============ panel ============ */
const OPENABLE = STAGES.filter(s=>s.sub).map(s=>s.id);
let current = null;

function openStage(id){
  const s = STAGES.find(x=>x.id===id);
  if(!s) return;
  current = id;
  const c = cvar(s.area);
  $('#peb').innerHTML = `<span>${s.phase}</span><span class="chip" style="--c:${c}">${AREAS[s.area]}</span>${s.section?`<span>${s.section}</span>`:''}`;
  $('#ptitle').textContent = `${s.id} · ${s.title}`;
  renderFlow($('#pflow'), s.sub, openStage);
  buildFicha(s);
  requestAnimationFrame(()=>fitDecisions($('#pflow')));
  const i = OPENABLE.indexOf(id);
  $('#prev').disabled = i<=0;
  $('#next').disabled = i>=OPENABLE.length-1;
  $('#ov').classList.add('on'); $('#panel').classList.add('on');
  $('#pbody').scrollTop = 0; $('.pflow').scrollTop = 0;
  document.body.style.overflow='hidden';
  $('#back').focus();
}
function closeStage(){
  $('#ov').classList.remove('on'); $('#panel').classList.remove('on');
  document.body.style.overflow='';
  current=null;
}
function step(d){
  const i = OPENABLE.indexOf(current);
  const j = i+d;
  if(j>=0 && j<OPENABLE.length) openStage(OPENABLE[j]);
}

function buildFicha(s){
  const f = $('#pficha'); f.innerHTML=''; f.style.setProperty('--c', cvar(s.area));
  const dl = el('dl','kv');
  dl.innerHTML = `<dt>Responsable</dt><dd>${s.resp||'—'}</dd>` +
                 (s.disparo?`<dt>Se dispara con</dt><dd>${s.disparo}</dd>`:'') +
                 (s.salida?`<dt>Entrega</dt><dd>${s.salida}</dd>`:'') +
                 (s.sistemas?`<dt>Sistemas</dt><dd>${s.sistemas}</dd>`:'');
  f.appendChild(el('h3','','Ficha'));
  f.appendChild(dl);
  const block=(title, items)=>{
    if(!items||!items.length) return;
    f.appendChild(el('h3','',title));
    const ul = el('ul');
    items.forEach(t=>ul.appendChild(el('li','',t)));
    f.appendChild(ul);
  };
  block('Reglas de negocio', s.reglas);
  block('Tiempos y plazos', s.tiempos);
  block('Salidas y excepciones', s.salidas);
  const tablas = s.tablas || (s.tabla ? [s.tabla] : []);
  tablas.forEach(tb=>{
    f.appendChild(el('h3','',tb.title));
    const t = el('table','tb');
    t.innerHTML = `<thead><tr>${tb.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>` +
      `<tbody>${tb.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
    f.appendChild(t);
  });
  if(s.docs&&s.docs.length){
    f.appendChild(el('h3','','Documentos relacionados'));
    const d = el('div','docs');
    s.docs.forEach(x=>d.appendChild(el('span','doc'+(x.miss?' miss':''), x.t)));
    f.appendChild(d);
  }
}

$('#back').onclick=closeStage; $('#close').onclick=closeStage; $('#ov').onclick=closeStage;
$('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
  if(!current) return;
  if(e.key==='Escape') closeStage();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});

let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>fitDecisions(document),150);});

buildLegend();
buildMap();
window.addEventListener('load',()=>fitDecisions(document));
</script>
</body>
